version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: todopaes
      POSTGRES_PASSWORD: todopaes
      POSTGRES_DB: todopaes
    ports: ["5432:5432"]
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env.example
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on: [postgres]
  frontend:
    build: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes: ["./frontend:/app"]
    ports: ["3000:3000"]
    depends_on: [backend]
