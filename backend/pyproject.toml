[project]
name = "todopaes-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy>=2",
  "pydantic>=2",
  "pydantic-settings",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "jinja2",
  "python-multipart",
  "pytest",
  "httpx",
  "alembic",
]

[tool.pytest.ini_options]
pythonpath = ["."]
